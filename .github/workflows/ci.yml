name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Type check
        run: npx tsc --noEmit
      - name: Run test suite
        run: npm test
      - name: Check README/docs accuracy
        run: bash scripts/check-docs-accuracy.sh
      - name: Install jarvis-builder dependencies
        run: npm install
        working-directory: jarvis-builder
      - name: Type check jarvis-builder
        run: npx tsc --noEmit
        working-directory: jarvis-builder
      - name: Run jarvis-builder test suite
        run: npm test
        working-directory: jarvis-builder
