name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    # A real Postgres, not just a placeholder host/user this job never
    # actually connects to. Before the WebauthnRepo/WebauthnRoutes tests
    # (biometric login), every DB-backed test in this suite was written to
    # assert "degrades cleanly when Postgres is unreachable" -- a genuinely
    # unreachable DB was an intentional, sufficient test condition, and this
    # job's POSTGRES_* vars only ever needed to look plausible enough for
    # server.ts's REQUIRED_ENV_VARS fail-fast to let a spawned HTTP Boundary
    # child process boot far enough to serve /health. The new webauthn tests
    # are the first in this suite that need a REAL round trip (insert a row,
    # read it back) to mean anything -- pgvector/pgvector, not plain
    # postgres, so pgvector-dependent code paths (memory-store.ts) get the
    # same real coverage as everything else migrated below, though pgvector
    # setup failing is itself non-fatal (db.ts:586) either way.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jarvis_ci
          POSTGRES_PASSWORD: jarvis_ci_password
          POSTGRES_DB: jarvis_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # HTTP Boundary tests spawn a real `tsx src/server.ts` child process,
      # which exits immediately if these are unset (see server.ts's own
      # REQUIRED_ENV_VARS fail-fast). Now genuinely reachable (see the
      # `services.postgres` block above), not just placeholder-shaped.
      POSTGRES_HOST: localhost
      POSTGRES_DB: jarvis_ci
      POSTGRES_USER: jarvis_ci
      POSTGRES_PASSWORD: jarvis_ci_password
      # tests/index.test.ts now transitively imports kernel/auth-middleware.ts
      # (via webauthn-routes.ts's top-level import chain, added for biometric
      # login) -- that module fails fast with process.exit(1) at import time
      # if neither ADMIN_API_KEY nor INTERNAL_API_KEY is set. Nothing in the
      # main test process needed one before this, so this job's env block
      # never set one -- HTTP Boundary tests' spawned `tsx src/server.ts`
      # children pass their own explicit override per-call instead (see
      # spawnTestServer's TEST_ADMIN_API_KEY usage), which is a separate
      # process and unaffected by this job-level var either way.
      ADMIN_API_KEY: jarvis_ci_placeholder_admin_key_do_not_use_in_prod
    steps:
      - uses: actions/checkout@v4
        with:
          # No later step in this job needs authenticated git operations
          # (no push, no fetch beyond the initial checkout) -- persisting
          # the GITHUB_TOKEN in local git config for the rest of the job
          # would be an unused credential sitting around for every
          # dependency-install/test step (npm install, pip install, pytest)
          # to potentially read.
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: npm install
      - name: Type check
        run: npx tsc --noEmit
      - name: Apply database migrations
        run: npx tsx scripts/ci-apply-migrations.ts
      - name: Run test suite
        run: npm test
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Python gateway tests
        run: |
          pip install -r requirements.txt
          pytest tests/test_api_gateway.py daemon/tests/test_protocol.py -v
      - name: Check README/docs accuracy
        run: bash scripts/check-docs-accuracy.sh
      - name: Install jarvis-builder dependencies
        run: npm install
        working-directory: jarvis-builder
      - name: Type check jarvis-builder
        run: npx tsc --noEmit
        working-directory: jarvis-builder
      - name: Run jarvis-builder test suite
        run: npm test
        working-directory: jarvis-builder
