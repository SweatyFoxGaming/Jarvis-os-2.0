services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jarvis_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jarvis
    ports:
      - "5432:5432"
      
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d jarvis"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  jarvis-daemon:
    build: .
    container_name: jarvis_master_daemon
    command: python3 -m daemon.main
    ports:
      - "8765:8765"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/jarvis
      - LAPTOP_IP=192.168.3.12
    depends_on:
      - postgres
    restart: always
    volumes:
      - .:/app

  redis:
    image: redis:alpine
    container_name: jarvis-redis
    ports:
      - "6379:6379"
    restart: always

  voice-daemon:
    build: .
    container_name: jarvis-voice-daemon
    environment:
      - AMBIENT_LISTENING_ENABLED=${AMBIENT_LISTENING_ENABLED:-false}
    restart: unless-stopped

volumes:
  pgdata:
