services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jarvis-os-api
    ports:
      - "8000:8000"
      - "3000:3000"
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    # Volumes mapping is helpful if you want code changes to reflect inside the container instantly
    volumes:
      - .:/app
      - /app/node_modules
      # A single dedicated folder for Jarvis's file/notes tool — nothing
      # outside it is ever reachable (see src/capabilities/providers/files.ts). Kept
      # as its own mount, not nested under /app, so it's clearly separate
      # from the repo itself.
      - ${JARVIS_FILES_DIR}:/jarvis-files
      # The user's real, existing Obsidian vault — same scoped-mount
      # pattern as the jarvis-files folder above, new root (see
      # src/capabilities/providers/obsidian.ts). Unlike JARVIS_FILES_DIR
      # (which always has a real value once .env is filled in),
      # OBSIDIAN_VAULT_DIR is expected to stay blank until the user
      # configures a real vault path — but Docker Compose's volumes: syntax
      # fails outright on an empty host-side path (unlike a plain env var,
      # which tolerates being blank fine), so this needs a fallback default
      # to let the container start at all before the feature is configured.
      # The vault sync job and every vault-writing function gate on
      # process.env.OBSIDIAN_VAULT_DIR itself (passed through via env_file,
      # a separate mechanism from this volume's own ${...} substitution),
      # so they still correctly no-op even though a mount now technically
      # exists pointing at this placeholder folder.
      - ${OBSIDIAN_VAULT_DIR:-./obsidian-vault-unconfigured}:/obsidian-vault
      # Shared with voice-daemon below so audio-client.ts's Unix-socket
      # connection (VOICE_DAEMON_SOCKET, defaulting to
      # /tmp/jarvis-voice/voice.sock in src/server.ts) actually reaches the
      # daemon process -- both containers must mount the same named volume
      # at the same path for the socket file to be visible to both sides.
      - voice-socket:/tmp/jarvis-voice
    # Lets the container reach services on the host (e.g. a local Ollama instance
    # on port 11434) via host.docker.internal — not automatic on native Linux Docker.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    # The long (mapping) form is required here, not the short `- service`
    # list form, because voice-daemon needs `condition: service_healthy`
    # (see below) -- Compose's depends_on doesn't allow mixing the two
    # forms in one block, so every entry uses the mapping form even though
    # postgres/llama-cpp/jarvis-builder only need plain start-order.
    depends_on:
      postgres:
        condition: service_started
      llama-cpp:
        condition: service_started
      jarvis-builder:
        condition: service_started
      # depends_on's plain start-order form only controls container START
      # ORDER, not readiness -- the daemon takes many seconds to import
      # torch/faster-whisper/kokoro after its process starts, and
      # audio-client.ts previously connected exactly once at api's own
      # startup with no retry, so a plain start-order dependency here
      # meant the very first connection attempt would very likely hit
      # ECONNREFUSED/ENOENT before the daemon's socket even existed, and
      # (pre-fix) never try again for the life of the process. Using
      # `condition: service_healthy` makes Docker actually wait for
      # voice-daemon's healthcheck (see its own definition below) to pass
      # before starting api. audio-client.ts also independently gained its
      # own reconnect-with-backoff loop as defense in depth (I5) -- this
      # healthcheck reduces how often that loop is needed on a normal
      # boot, it doesn't replace it.
      voice-daemon:
        condition: service_healthy

  # Offline-first local inference: serves a GGUF model you already have on
  # disk over an OpenAI-compatible API, entirely inside the Docker network —
  # no host-networking/bind-address dependency the way a host-run Ollama has
  # (see README's "Local LLM chat" note). Gemini stays fully optional.
  llama-cpp:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: jarvis-llama-cpp
    volumes:
      - ${HOST_MODEL_DIR}:/models:ro
    command: ["-m", "/models/${LOCAL_MODEL_FILE}", "--host", "0.0.0.0", "--port", "8080", "-c", "4096"]
    restart: unless-stopped

  # Local Unix-socket STT/TTS service (see daemon/) that replaced the
  # whisper-cpp + openai-edge-tts services below -- one Python process
  # doing faster-whisper transcription and Kokoro synthesis over a shared
  # socket instead of two separate HTTP services. jarvis-os-api reaches it
  # via the voice-socket volume mounted into both containers at
  # /tmp/jarvis-voice (see api's volumes: above and audio-client.ts).
  voice-daemon:
    build:
      context: ./daemon
    container_name: jarvis-voice-daemon
    restart: unless-stopped
    volumes:
      - voice-socket:/tmp/jarvis-voice
      # Persists faster-whisper/Kokoro-82M model weights (downloaded from
      # Hugging Face into ~/.cache/huggingface on first real use -- this
      # daemon runs as root per daemon/Dockerfile, so that's
      # /root/.cache/huggingface) across restarts and rebuilds. Without
      # this, the weights live only in the container's ephemeral
      # filesystem layer and re-download on every `docker compose up
      # --force-recreate`/image rebuild, which defeats the "offline-
      # capable" claim on anything but a container that's never been
      # recreated. Named-volume, matching this file's existing convention
      # for shared state (voice-socket above) rather than a host bind
      # mount, since (unlike llama-cpp's model dir) there's no existing
      # host-side model directory a user is expected to already have for
      # these weights -- they're fetched automatically on first use.
      - voice-model-cache:/root/.cache/huggingface
    # Unix-socket service, so there's no HTTP endpoint to probe -- checks
    # that the socket file the daemon creates at startup (see
    # voice_engine.py's main()) actually exists and is a real socket.
    # start_period is generous because faster-whisper/Kokoro/torch import
    # alone (before the socket is even created) has been observed to take
    # tens of seconds on this CPU-only box, on top of any first-run model
    # download.
    healthcheck:
      # CMD-SHELL (not CMD) because `test` is used as a shell builtin here,
      # not relied on as a standalone /usr/bin/test binary that may or may
      # not exist in daemon/Dockerfile's python:3.11-slim base.
      test: ["CMD-SHELL", "test -S /tmp/jarvis-voice/voice.sock || exit 1"]
      interval: 5s
      timeout: 3s
      start_period: 90s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg16
    container_name: jarvis-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - /mnt/jarvis_home/postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # The only service in this stack with access to the host's Docker
  # socket — see docs/superpowers/specs/2026-07-24-agentic-coding-department-design.md
  # for why this is split out from the main api service instead of
  # mounting the socket there directly. Deliberately has no LLM/chat/
  # business logic of its own: it only creates, execs into, and destroys
  # per-build-request sandbox containers on api's behalf, over an
  # internal-only API gated by JARVIS_BUILDER_SECRET.
  jarvis-builder:
    build:
      context: ./jarvis-builder
      dockerfile: Dockerfile
    container_name: jarvis-builder
    environment:
      - JARVIS_BUILDER_SECRET=${JARVIS_BUILDER_SECRET}
      - JARVIS_REPO_HOST_PATH=${JARVIS_REPO_HOST_PATH:-/mnt/jarvis_home/llm}
    volumes:
      # Mounted at the SAME path it has on the real host, not remapped
      # (unlike api's `.:/app`) — see this plan's Global Constraints.
      - ${JARVIS_REPO_HOST_PATH:-/mnt/jarvis_home/llm}:${JARVIS_REPO_HOST_PATH:-/mnt/jarvis_home/llm}
      - /var/run/docker.sock:/var/run/docker.sock
    # No ports: — never published to the host or reachable outside this
    # compose network. api reaches it at http://jarvis-builder:4100.
    restart: unless-stopped

# Shared between api and voice-daemon so both containers see the same
# voice.sock file at /tmp/jarvis-voice (see api's and voice-daemon's
# volumes: above). postgres uses a host bind mount instead of a named
# volume, so this is the first entry in this section.
volumes:
  voice-socket:
  # Persistent faster-whisper/Kokoro-82M model-weight cache -- see
  # voice-daemon's volumes: above for the full rationale.
  voice-model-cache:
